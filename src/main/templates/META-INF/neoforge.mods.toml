modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
# Ajoute les raretés LEGENDARY et MYTHIC à l'enum vanilla Rarity (remplace Rarity.create de Forge 1.20)
enumExtensions="META-INF/enumextensions.json"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Styles de tooltips animés par rareté (assets/itemsrarity/tooltips)
[[dependencies.${mod_id}]]
    modId="obscure_tooltips"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
